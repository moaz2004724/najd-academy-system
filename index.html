<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نادي نجد الرياض</title>
    <link rel="stylesheet" href="/NajdIcons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script>
      (function() {
        function replaceRiyal(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            let text = node.nodeValue;
            if (text.includes('ر.س')) {
              node.nodeValue = text.replace(/ر\.س/g, '\uE000');
            }
          } else {
            if (node.nodeName === 'SCRIPT' || node.nodeName === 'STYLE' || node.nodeName === 'IFRAME') return;
            const children = Array.from(node.childNodes);
            for (let child of children) {
              replaceRiyal(child);
            }
          }
        }

        document.addEventListener('DOMContentLoaded', () => {
          replaceRiyal(document.body);

          const observer = new MutationObserver((mutations) => {
            for (let mutation of mutations) {
              if (mutation.type === 'childList') {
                mutation.addedNodes.forEach(node => replaceRiyal(node));
              } else if (mutation.type === 'characterData') {
                replaceRiyal(mutation.target);
              }
            }
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
